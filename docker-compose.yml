services:
  app:
    image: kyrobi/youtube-summarizer:latest
    container_name: youtube-summarizer
    pull_policy: always
    ports:
      - "8533:8533"
    volumes:
      - /home/ubuntu/Server/Service/VideoSummarizer:/app/data
    environment:
      SPRING_CONFIG_LOCATION: file:/app/data/application.properties
    restart: unless-stopped